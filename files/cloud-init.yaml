#cloud-config
# Container-Optimized OS. Rootfs is read-only and /home is noexec, so all
# persistent state lives on the attached data disk mounted at /mnt/disks/data.

write_files:
  # ---------------------------------------------------------------------------
  # One-time formatting of the data disk. mkfs runs ONLY if the disk has no
  # filesystem, so re-running this on an existing vault is a no-op.
  # ---------------------------------------------------------------------------
  - path: /etc/vaultwarden/init-disk.sh
    permissions: "0755"
    owner: root
    content: |
      #!/bin/bash
      set -euo pipefail
      DEVICE="/dev/disk/by-id/google-vaultwarden-data"
      MOUNT="/mnt/disks/data"

      mkdir -p "$MOUNT"

      if ! blkid "$DEVICE" >/dev/null 2>&1; then
        echo "No filesystem on $DEVICE; creating ext4."
        mkfs.ext4 -m 0 -E lazy_itable_init=0,lazy_journal_init=0,discard "$DEVICE"
      else
        echo "Filesystem already present on $DEVICE; leaving it alone."
      fi

      # discard keeps the disk thin; noatime avoids needless writes for SQLite.
      mount -o discard,defaults,noatime "$DEVICE" "$MOUNT"

      mkdir -p "$MOUNT/vaultwarden" "$MOUNT/caddy/data" "$MOUNT/caddy/config"
      mkdir -p "$MOUNT/wireguard/peers"
      # Vaultwarden's alpine image runs as root by default; keep 0700 so the
      # SQLite DB and rsa_key.pem are not world-readable.
      chmod 0700 "$MOUNT/vaultwarden"
      # Private keys for the VPN server and every peer live here.
      chmod 0700 "$MOUNT/wireguard" "$MOUNT/wireguard/peers"

      # 1GB of RAM with no swap is tight; icon fetches can spike. A small
      # swapfile is cheap insurance against the OOM killer taking Vaultwarden.
      if [ ! -f "$MOUNT/swapfile" ]; then
        fallocate -l 1G "$MOUNT/swapfile"
        chmod 600 "$MOUNT/swapfile"
        mkswap "$MOUNT/swapfile"
      fi
      swapon "$MOUNT/swapfile" || true

  - path: /etc/vaultwarden/Caddyfile
    permissions: "0644"
    owner: root
    content: |
      {
        email ${acme_email}
      }

      ${domain} {
        encode gzip

        # Vaultwarden serves the API, web vault and the WebSocket
        # notifications endpoint all from the same port.
        reverse_proxy vaultwarden:8080 {
          header_up X-Real-IP {remote_host}
        }

        header {
          Strict-Transport-Security "max-age=31536000; includeSubDomains"
          X-Frame-Options "SAMEORIGIN"
          X-Content-Type-Options "nosniff"
          Referrer-Policy "same-origin"
          -Server
        }

        log {
          output stderr
          format console
        }
      }

  # ---------------------------------------------------------------------------
  # Fetch the admin token from Secret Manager at boot rather than baking it into
  # instance metadata, where anyone with compute.instances.get could read it.
  # ---------------------------------------------------------------------------
  - path: /etc/vaultwarden/fetch-secrets.sh
    permissions: "0755"
    owner: root
    content: |
      #!/bin/bash
      set -euo pipefail
      ENV_FILE="/mnt/disks/data/vaultwarden/admin.env"
      : > "$ENV_FILE"
      chmod 0600 "$ENV_FILE"

      if [ "${enable_admin_page}" != "true" ]; then
        echo "Admin page disabled."
        exit 0
      fi

      TOKEN_URL="https://secretmanager.googleapis.com/v1/projects/${project_id}/secrets/${admin_secret_id}/versions/latest:access"

      # Parse with python3 (present on COS) rather than sed: the Secret Manager
      # response is pretty-printed multi-line JSON, which a line-oriented sed
      # pattern cannot match reliably.
      ACCESS_TOKEN="$(curl -s -H 'Metadata-Flavor: Google' \
        'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token' \
        | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' 2>/dev/null || true)"

      if [ -z "$ACCESS_TOKEN" ]; then
        echo "WARNING: no metadata access token; admin page will be disabled." >&2
        exit 0
      fi

      PAYLOAD="$(curl -s -H "Authorization: Bearer $ACCESS_TOKEN" "$TOKEN_URL" \
        | python3 -c 'import json,sys,base64; print(base64.b64decode(json.load(sys.stdin)["payload"]["data"]).decode())' 2>/dev/null || true)"

      if [ -z "$PAYLOAD" ]; then
        echo "WARNING: could not read admin token; admin page will be disabled." >&2
        exit 0
      fi

      # Written as a docker env-file. The value may contain '$' (Argon2 PHC),
      # so it must never be passed through shell interpolation.
      printf 'ADMIN_TOKEN=%s\n' "$PAYLOAD" > "$ENV_FILE"

  # ---------------------------------------------------------------------------
  # Runtime settings are read from instance metadata on every service start,
  # NOT baked into the unit file. cloud-init runs only on first boot, so a unit
  # with values substituted at render time would silently ignore any later
  # `terraform apply` until the VM was rebuilt.
  # ---------------------------------------------------------------------------
  - path: /etc/vaultwarden/fetch-runtime-config.sh
    permissions: "0755"
    owner: root
    content: |
      #!/bin/bash
      set -euo pipefail
      ENV_FILE="/mnt/disks/data/vaultwarden/runtime.env"

      md() {
        curl -s -f -H 'Metadata-Flavor: Google' \
          "http://metadata.google.internal/computeMetadata/v1/instance/attributes/$1" 2>/dev/null || echo "$2"
      }

      {
        printf 'DOMAIN=%s\n'          "$(md vw-domain          'https://${domain}')"
        printf 'SIGNUPS_ALLOWED=%s\n' "$(md vw-signups-allowed '${signups_allowed}')"
      } > "$ENV_FILE"
      chmod 0600 "$ENV_FILE"
      echo "Runtime config: $(tr '\n' ' ' < "$ENV_FILE")"

  # ---------------------------------------------------------------------------
  # WireGuard runtime settings, same two-tier pattern as fetch-runtime-config.sh:
  # read from metadata on every start so the port and tunnel subnet can change
  # without rebuilding the VM.
  # ---------------------------------------------------------------------------
  - path: /etc/vaultwarden/wg-runtime-config.sh
    permissions: "0755"
    owner: root
    content: |
      #!/bin/bash
      set -euo pipefail
      ENV_FILE="/mnt/disks/data/wireguard/runtime.env"
      mkdir -p /mnt/disks/data/wireguard/peers
      chmod 0700 /mnt/disks/data/wireguard /mnt/disks/data/wireguard/peers

      md() {
        curl -s -f -H 'Metadata-Flavor: Google' \
          "http://metadata.google.internal/computeMetadata/v1/instance/attributes/$1" 2>/dev/null || echo "$2"
      }

      {
        printf 'WG_PORT=%s\n'     "$(md wg-port   '${wireguard_port}')"
        printf 'WG_SUBNET=%s\n'   "$(md wg-subnet '${wireguard_subnet}')"
        printf 'WG_ENDPOINT=%s\n' '${wireguard_endpoint}'
      } > "$ENV_FILE"
      chmod 0600 "$ENV_FILE"
      echo "WireGuard runtime config: $(tr '\n' ' ' < "$ENV_FILE")"

  # ---------------------------------------------------------------------------
  # Generates the server keypair once, then rebuilds wg0.conf from the per-peer
  # files in peers/ on every start. Treating peers/ as the source of truth means
  # adding or revoking a device is a file plus a restart, and a reboot can never
  # regenerate keys that clients already trust.
  # ---------------------------------------------------------------------------
  - path: /etc/vaultwarden/wg-init.sh
    permissions: "0755"
    owner: root
    content: |
      #!/bin/bash
      set -euo pipefail
      WG="/mnt/disks/data/wireguard"
      # shellcheck disable=SC1091
      . "$WG/runtime.env"

      # Forwarding is what makes this an exit node rather than a private overlay.
      # Deliberately NOT net.ipv4.conf.all.src_valid_mark: on COS that setting
      # propagates to eth0 and drops every established SSH and HTTPS connection
      # the moment it is applied, leaving the VM unreachable until a reset. It is
      # only needed for wg-quick's fwmark-based default route, which this setup
      # does not use — the tunnel is a plain interface plus explicit NAT.
      sysctl -qw net.ipv4.ip_forward=1

      # COS ships the in-tree WireGuard module, so the datapath is the kernel's.
      modprobe wireguard

      # Only the `wg` userspace tool comes from the container: it is musl-linked
      # and cannot run on COS directly, and COS has no package manager. The
      # container is transient and shares the host netns just long enough to
      # configure wg0 — it is NOT a long-running --network host service, which is
      # what previously took the VM's networking down at every restart.
      wg_run() {
        /usr/bin/docker run --rm -i --network host --cap-add NET_ADMIN \
          -v "$WG:/wg" --entrypoint "" ${wireguard_image} "$@"
      }

      if [ ! -f "$WG/server_private.key" ]; then
        echo "Generating WireGuard server keypair."
        umask 077
        wg_run wg genkey > "$WG/server_private.key"
        chmod 0600 "$WG/server_private.key"
        wg_run wg pubkey < "$WG/server_private.key" > "$WG/server_public.key"
        chmod 0644 "$WG/server_public.key"
      fi

      # First host address in the tunnel range, e.g. 10.8.0.1 for 10.8.0.0/24.
      SERVER_IP="$(python3 -c "import ipaddress,sys; print(str(ipaddress.ip_network(sys.argv[1])[1]))" "$WG_SUBNET")"
      PREFIX="$${WG_SUBNET#*/}"

      # Torn down and rebuilt from scratch, so a removed peer file is a real
      # revocation rather than a stale entry left in the running interface.
      if ip link show wg0 >/dev/null 2>&1; then
        /bin/bash /etc/vaultwarden/wg-firewall.sh down "$WG_SUBNET" "$WG_PORT" || true
        ip link del wg0
      fi

      ip link add dev wg0 type wireguard
      ip address add "$SERVER_IP/$PREFIX" dev wg0

      # Peer set is written as a wg(8) config fragment holding only [Peer]
      # stanzas; `wg setconf` applies the interface key, port and peers at once.
      FRAG="$WG/wg0.conf"
      umask 077
      {
        echo "[Interface]"
        echo "ListenPort = $WG_PORT"
        echo "PrivateKey = $(cat "$WG/server_private.key")"

        shopt -s nullglob
        for peer in "$WG"/peers/*.conf; do
          name="$(basename "$peer" .conf)"
          # shellcheck disable=SC1090
          ( . "$peer"
            echo
            echo "# $name"
            echo "[Peer]"
            echo "PublicKey = $PEER_PUBLIC"
            echo "PresharedKey = $PEER_PSK"
            # /32 so no peer can source-spoof another's tunnel address.
            echo "AllowedIPs = $PEER_IP/32" )
        done
      } > "$FRAG"
      chmod 0600 "$FRAG"

      wg_run wg setconf wg0 /wg/wg0.conf

      # GCE's NIC is 1460, not the usual 1500, and WireGuard's own header costs
      # 80 bytes. wg-quick's default of 1420 assumes a 1500-byte path, so on GCP
      # it produces packets that need fragmenting; the symptom is a tunnel that
      # handshakes fine and then stalls on anything larger than a ping.
      ip link set mtu 1380 dev wg0
      ip link set wg0 up

      /bin/bash /etc/vaultwarden/wg-firewall.sh up "$WG_SUBNET" "$WG_PORT"
      echo "wg0 up on $SERVER_IP/$PREFIX port $WG_PORT with $(grep -c '^\[Peer\]' "$FRAG" || true) peer(s)."

  # ---------------------------------------------------------------------------
  # NAT and isolation rules, invoked by wg0.conf's PostUp/PostDown. Called with
  # `up <subnet>` / `down <subnet>`; `down` mirrors `up` exactly so a restart
  # leaves no duplicate rules behind.
  # ---------------------------------------------------------------------------
  - path: /etc/vaultwarden/wg-firewall.sh
    permissions: "0755"
    owner: root
    content: |
      #!/bin/bash
      set -euo pipefail
      ACTION="$1"
      SUBNET="$2"
      PORT="$${3:-51820}"

      # The default-route interface, not a hardcoded eth0. The instance's public
      # address is 1:1 NAT upstream and never appears on the NIC, so traffic has
      # to be masqueraded to whichever interface holds the internal address.
      IFACE="$(ip -4 route show default | awk '{print $5; exit}')"
      [ -n "$IFACE" ] || { echo "No default route interface found." >&2; exit 1; }

      case "$ACTION" in
        up)   nat=-A; fwd=-I ;;
        down) nat=-D; fwd=-D ;;
        *)    echo "Usage: wg-firewall.sh {up|down} <subnet>" >&2; exit 64 ;;
      esac

      # COS ships a default-DROP INPUT chain that permits only established
      # connections, loopback, ICMP and SSH. Without this rule the handshake
      # never reaches WireGuard: GCP's firewall allows the packet, the VM's own
      # firewall then silently drops it, and the client just times out. Docker's
      # published ports bypass INPUT via its own chains, which is why HTTP and
      # HTTPS work without an equivalent rule and this omission is easy to miss.
      iptables $fwd INPUT -p udp --dport "$PORT" -j ACCEPT

      # Traffic originating from the tunnel is addressed to the VM itself.
      iptables $fwd INPUT -i wg0 -j ACCEPT

      # This is the line that turns the VM into an exit node: rewrite the source
      # of tunnel traffic to the VM's own address so replies come back here.
      iptables -t nat $nat POSTROUTING -s "$SUBNET" -o "$IFACE" -j MASQUERADE

      # -I inserts at the head of FORWARD, ahead of the ACCEPT rules Docker
      # installs for the Vaultwarden containers. Listed here in reverse of the
      # order they end up in, since each insert pushes the previous one down.
      iptables $fwd FORWARD -i wg0 -o "$IFACE" -j ACCEPT
      iptables $fwd FORWARD -i "$IFACE" -o wg0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT

      # Deny rules, which must sit ABOVE the accepts above once inserted.
      # 169.254.169.254 is the critical one: reaching the metadata server would
      # hand a VPN client the VM's service-account token, and with it the
      # admin-token secret and the backup bucket.
      for net in 192.168.0.0/16 172.16.0.0/12 10.0.0.0/8 169.254.0.0/16; do
        iptables $fwd FORWARD -i wg0 -d "$net" -j REJECT
      done

      # Lands above every REJECT above. The tunnel range lives inside
      # 10.0.0.0/8; without this exemption the blanket RFC1918 deny would
      # blackhole the VPN's own traffic between peers and the server.
      iptables $fwd FORWARD -i wg0 -d "$SUBNET" -j RETURN

      # Inserted last so it sits at the very top, ahead of the RETURN that would
      # otherwise let peers reach one another. Hub-and-spoke: devices talk to
      # the internet through this box, never to each other.
      iptables $fwd FORWARD -i wg0 -o wg0 -j DROP

  # ---------------------------------------------------------------------------
  # Operator tool for managing VPN devices. Peer private keys are generated here
  # and shown once; they are stored on the data disk so `show` can reprint a
  # config, and never leave the VM by any other path.
  # ---------------------------------------------------------------------------
  - path: /etc/vaultwarden/wg-peer.sh
    permissions: "0755"
    owner: root
    content: |
      #!/bin/bash
      set -euo pipefail
      WG="/mnt/disks/data/wireguard"
      # shellcheck disable=SC1091
      . "$WG/runtime.env"

      wg_run() { /usr/bin/docker run --rm -i --entrypoint "" ${wireguard_image} "$@"; }

      usage() {
        echo "Usage: wg-peer.sh {add|show|qr|list|remove} [name]" >&2
        echo "  qr <name>  writes a scannable PNG to /tmp/<name>-qr.png" >&2
        exit 64
      }

      render() {
        local name="$1"
        # shellcheck disable=SC1090
        . "$WG/peers/$name.conf"
        local prefix="$${WG_SUBNET#*/}"
        cat <<EOF
      [Interface]
      PrivateKey = $PEER_PRIVATE
      Address = $PEER_IP/$prefix
      DNS = 1.1.1.1, 1.0.0.1

      [Peer]
      PublicKey = $(cat "$WG/server_public.key")
      PresharedKey = $PEER_PSK
      Endpoint = $WG_ENDPOINT:$WG_PORT
      AllowedIPs = 0.0.0.0/0, ::/0
      PersistentKeepalive = 25
      EOF
      }

      # A PNG, not a terminal QR: ANSI block output frequently fails to scan and
      # cannot be copied off the box. Written somewhere the operator can fetch it
      # with `gcloud compute scp`.
      write_png() {
        local name="$1" out="/tmp/$name-qr.png"
        render "$name" | wg_run qrencode -t png -o - -s 10 -m 2 > "$out"
        chmod 0644 "$out"
        echo "QR written to $out on the VM. Fetch it with:"
        echo "  gcloud compute scp vaultwarden:$out ~/Desktop/$name-qr.png \\"
        echo "    --project ${project_id} --zone ${zone} --tunnel-through-iap"
      }

      cmd="$${1:-}"
      case "$cmd" in
        add)
          name="$${2:-}"; [ -n "$name" ] || usage
          [ -f "$WG/peers/$name.conf" ] && { echo "Peer '$name' already exists." >&2; exit 1; }

          # Lowest free host address above the server's own (.1).
          used="$(grep -h '^PEER_IP=' "$WG"/peers/*.conf 2>/dev/null | cut -d= -f2 || true)"
          peer_ip="$(python3 - "$WG_SUBNET" <<'PY' "$used"
      import ipaddress, sys
      net = ipaddress.ip_network(sys.argv[1])
      taken = set(filter(None, sys.argv[2].split())) if len(sys.argv) > 2 else set()
      for host in list(net.hosts())[1:]:
          if str(host) not in taken:
              print(host); break
      else:
          sys.exit("No free addresses left in " + str(net))
      PY
      )"

          umask 077
          priv="$(wg_run wg genkey)"
          pub="$(printf '%s' "$priv" | wg_run wg pubkey)"
          psk="$(wg_run wg genpsk)"

          cat > "$WG/peers/$name.conf" <<EOF
      PEER_PRIVATE=$priv
      PEER_PUBLIC=$pub
      PEER_PSK=$psk
      PEER_IP=$peer_ip
      EOF
          chmod 0600 "$WG/peers/$name.conf"

          systemctl restart wireguard.service
          echo "Peer '$name' added as $peer_ip."
          echo
          render "$name"
          echo
          write_png "$name"
          ;;
        show)
          name="$${2:-}"; [ -n "$name" ] || usage
          [ -f "$WG/peers/$name.conf" ] || { echo "No such peer: $name" >&2; exit 1; }
          render "$name"
          ;;
        qr)
          name="$${2:-}"; [ -n "$name" ] || usage
          [ -f "$WG/peers/$name.conf" ] || { echo "No such peer: $name" >&2; exit 1; }
          write_png "$name"
          ;;
        list)
          shopt -s nullglob
          printf '%-16s %s\n' "PEER" "TUNNEL IP"
          for peer in "$WG"/peers/*.conf; do
            # shellcheck disable=SC1090
            ( . "$peer"; printf '%-16s %s\n' "$(basename "$peer" .conf)" "$PEER_IP" )
          done
          echo
          # Needs the host netns to see wg0; there is no long-lived container.
          /usr/bin/docker run --rm --network host --cap-add NET_ADMIN \
            --entrypoint "" ${wireguard_image} wg show 2>/dev/null || true
          ;;
        remove)
          name="$${2:-}"; [ -n "$name" ] || usage
          [ -f "$WG/peers/$name.conf" ] || { echo "No such peer: $name" >&2; exit 1; }
          rm -f "$WG/peers/$name.conf"
          systemctl restart wireguard.service
          echo "Peer '$name' removed; its key no longer appears in wg0.conf."
          ;;
        *)
          usage
          ;;
      esac

  # ---------------------------------------------------------------------------
  # Backup: SIGUSR1 makes Vaultwarden run `VACUUM INTO`, producing a
  # transactionally consistent SQLite copy. The DB alone is NOT restorable —
  # rsa_key.pem (JWT signing key), config.json, attachments and sends are
  # archived alongside it.
  # ---------------------------------------------------------------------------
  - path: /etc/vaultwarden/backup.sh
    permissions: "0755"
    owner: root
    content: |
      #!/bin/bash
      set -euo pipefail
      DATA="/mnt/disks/data/vaultwarden"
      BUCKET="${backup_bucket}"
      STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
      WORK="$(mktemp -d)"
      trap 'rm -rf "$WORK"' EXIT

      # Clear any snapshot left behind by a previous failed run, so the "newest
      # file" selection below cannot silently pick up a stale database.
      rm -f "$DATA"/db_*.sqlite3

      # `backup` runs the same VACUUM INTO as the USR1 signal, but synchronously
      # and with a non-zero exit + message on failure. USR1 is fire-and-forget,
      # which makes a failed backup look identical to a successful one.
      /usr/bin/docker exec vaultwarden /vaultwarden backup

      # Newest snapshot; Vaultwarden names them db_<timestamp>.sqlite3.
      SNAPSHOT="$(find "$DATA" -maxdepth 1 -name 'db_*.sqlite3' -print0 2>/dev/null \
        | xargs -0 -r ls -1t 2>/dev/null | head -1)"
      if [ -z "$SNAPSHOT" ]; then
        echo "ERROR: no snapshot produced; aborting backup." >&2
        exit 1
      fi

      cp "$SNAPSHOT" "$WORK/db.sqlite3"
      # rsa_key.pem is essential: without it every client session is invalidated.
      for f in rsa_key.pem rsa_key.pub.pem config.json; do
        [ -f "$DATA/$f" ] && cp "$DATA/$f" "$WORK/" || true
      done
      for d in attachments sends; do
        [ -d "$DATA/$d" ] && cp -r "$DATA/$d" "$WORK/" || true
      done

      TAR="/tmp/vaultwarden-$STAMP.tar.gz"
      tar -czf "$TAR" -C "$WORK" .

      # Plain resumable-free PUT to the JSON API rather than `gcloud storage cp`.
      # gcloud performs a preflight GET, which would require storage.objects.get
      # and thus read access to every existing backup. A raw upload needs only
      # storage.objects.create, so a compromised VM can add new backups but can
      # neither read nor destroy the existing history.
      ACCESS_TOKEN="$(curl -s -H 'Metadata-Flavor: Google' \
        'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token' \
        | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"

      HTTP_CODE="$(curl -s -o /tmp/upload_result.json -w '%%{http_code}' \
        -X POST \
        -H "Authorization: Bearer $ACCESS_TOKEN" \
        -H "Content-Type: application/gzip" \
        --data-binary "@$TAR" \
        "https://storage.googleapis.com/upload/storage/v1/b/$BUCKET/o?uploadType=media&name=vaultwarden-$STAMP.tar.gz")"

      if [ "$HTTP_CODE" != "200" ]; then
        echo "ERROR: upload failed with HTTP $HTTP_CODE" >&2
        cat /tmp/upload_result.json >&2 || true
        exit 1
      fi

      # The snapshot is a full copy of the DB; leaving them around fills the disk.
      rm -f "$SNAPSHOT" "$TAR"
      echo "Backup complete: gs://$BUCKET/vaultwarden-$STAMP.tar.gz"

  - path: /etc/systemd/system/vaultwarden.service
    permissions: "0644"
    owner: root
    content: |
      [Unit]
      Description=Vaultwarden
      After=network-online.target vaultwarden-disk.service
      Requires=vaultwarden-disk.service
      Wants=network-online.target

      [Service]
      Restart=always
      RestartSec=10
      ExecStartPre=/bin/bash /etc/vaultwarden/fetch-secrets.sh
      ExecStartPre=/bin/bash /etc/vaultwarden/fetch-runtime-config.sh
      ExecStartPre=-/usr/bin/docker rm -f vaultwarden
      ExecStart=/usr/bin/docker run --rm --name vaultwarden \
        --network vaultwarden-net \
        --env-file /mnt/disks/data/vaultwarden/admin.env \
        --env-file /mnt/disks/data/vaultwarden/runtime.env \
        -e ROCKET_PORT=8080 \
        -e ROCKET_ADDRESS=0.0.0.0 \
        -e DATA_FOLDER=/data \
        -e ENABLE_WEBSOCKET=true \
        -e LOG_LEVEL=warn \
        -e IP_HEADER=X-Real-IP \
        -v /mnt/disks/data/vaultwarden:/data \
        ${vaultwarden_image}
      ExecStop=/usr/bin/docker stop --time=30 vaultwarden

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/vaultwarden-disk.service
    permissions: "0644"
    owner: root
    content: |
      [Unit]
      Description=Prepare and mount the Vaultwarden data disk
      After=local-fs.target
      Before=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=true
      ExecStart=/bin/bash /etc/vaultwarden/init-disk.sh
      ExecStartPost=-/usr/bin/docker network create vaultwarden-net

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/caddy.service
    permissions: "0644"
    owner: root
    content: |
      [Unit]
      Description=Caddy reverse proxy with automatic HTTPS
      After=network-online.target vaultwarden.service
      Requires=vaultwarden-disk.service
      Wants=network-online.target

      [Service]
      Restart=always
      RestartSec=10
      ExecStartPre=-/usr/bin/docker rm -f caddy
      ExecStart=/usr/bin/docker run --rm --name caddy \
        --network vaultwarden-net \
        -p 80:80 -p 443:443 -p 443:443/udp \
        -v /etc/vaultwarden/Caddyfile:/etc/caddy/Caddyfile:ro \
        -v /mnt/disks/data/caddy/data:/data \
        -v /mnt/disks/data/caddy/config:/config \
        ${caddy_image}
      ExecStop=/usr/bin/docker stop --time=15 caddy

      [Install]
      WantedBy=multi-user.target

  # ---------------------------------------------------------------------------
  # Tears the tunnel down. Mirrors the setup in wg-init.sh so that a restart
  # leaves no interface and no iptables rules behind.
  # ---------------------------------------------------------------------------
  - path: /etc/vaultwarden/wg-down.sh
    permissions: "0755"
    owner: root
    content: |
      #!/bin/bash
      set -uo pipefail
      WG="/mnt/disks/data/wireguard"
      # shellcheck disable=SC1091
      [ -f "$WG/runtime.env" ] && . "$WG/runtime.env"
      /bin/bash /etc/vaultwarden/wg-firewall.sh down "$${WG_SUBNET:-10.8.0.0/24}" "$${WG_PORT:-51820}" 2>/dev/null || true
      ip link del wg0 2>/dev/null || true
      exit 0

  # ---------------------------------------------------------------------------
  # Type=oneshot with RemainAfterExit: the tunnel is kernel state, not a
  # process, so there is nothing to supervise once wg0 exists.
  #
  # Deliberately NOT a long-running `docker run --network host` container. That
  # arrangement took the VM's entire network down — SSH and Vaultwarden included
  # — every time the unit started, because the image's s6 init reconfigures the
  # namespace it is given, which under --network host is the host's own.
  # ---------------------------------------------------------------------------
  - path: /etc/systemd/system/wireguard.service
    permissions: "0644"
    owner: root
    content: |
      [Unit]
      Description=WireGuard VPN exit node
      After=network-online.target vaultwarden-disk.service docker.service
      Requires=vaultwarden-disk.service docker.service
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=true
      ExecStartPre=/bin/bash /etc/vaultwarden/wg-runtime-config.sh
      ExecStart=/bin/bash /etc/vaultwarden/wg-init.sh
      ExecStop=/bin/bash /etc/vaultwarden/wg-down.sh

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/vaultwarden-backup.service
    permissions: "0644"
    owner: root
    content: |
      [Unit]
      Description=Back up Vaultwarden to GCS
      After=vaultwarden.service

      [Service]
      Type=oneshot
      ExecStart=/bin/bash /etc/vaultwarden/backup.sh

  - path: /etc/systemd/system/vaultwarden-backup.timer
    permissions: "0644"
    owner: root
    content: |
      [Unit]
      Description=Nightly Vaultwarden backup

      [Timer]
      OnCalendar=${backup_schedule}
      Persistent=true
      RandomizedDelaySec=600

      [Install]
      WantedBy=timers.target

runcmd:
  - systemctl daemon-reload
  - systemctl enable --now vaultwarden-disk.service
  - systemctl enable --now vaultwarden.service
  - systemctl enable --now caddy.service
  - systemctl enable --now wireguard.service
  - systemctl enable --now vaultwarden-backup.timer
